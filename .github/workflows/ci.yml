# 推到 main 与每个 PR 都跑一遍。言以 Windows 为准：check 一项挡合并；端到端与 macOS 先试跑，失败都不挡
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 单测 · 类型 · 格式
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run unit
      - run: npm run check
      - run: npx --yes prettier@3.3.3 --check .

  e2e:
    name: 端到端（试跑）
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/run.mjs

  macos:
    name: macOS 测试（不挡合并）
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - run: npm run unit
      - run: node test/run.mjs
        env:
          YAN_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      # upload-artifact 默认跳过隐藏文件，test/.tmp 整个会被略过；只把顶层截图拷到非隐藏目录再传，不带测试用的配置与浏览器目录
      - if: ${{ failure() }}
        name: 拷出失败截图
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, existsSync, mkdirSync, readdirSync } from "node:fs";
          import path from "node:path";

          const source = "test/.tmp";
          const destination = "test-diagnostics-macos";
          mkdirSync(destination, { recursive: true });
          if (existsSync(source)) {
            for (const entry of readdirSync(source, { withFileTypes: true })) {
              if (!entry.isFile() || entry.name.startsWith(".") || !entry.name.endsWith(".png")) continue;
              copyFileSync(path.join(source, entry.name), path.join(destination, entry.name));
            }
          }
          NODE
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: yan-test-diagnostics-macos
          path: test-diagnostics-macos
          if-no-files-found: warn
          retention-days: 7
