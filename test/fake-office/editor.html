<!doctype html>
<meta charset="utf-8">
<title>假引擎</title>
<!-- 测试用的假 Office 引擎：只实现宿主页用到的那几条嵌入接口（ready、open-buffer、save、set-readonly、dirty-changed），正文就是一个文本框 -->
<textarea id="body" style="width:100%;height:90vh"></textarea>
<script>
  const body = document.getElementById("body");
  let name = "document.docx", dirty = false;
  const post = (type, payload = {}, id) => parent.postMessage({ type, payload, id }, location.origin);
  const setDirty = value => {
    if (dirty !== value) post("document:dirty-changed", { dirty: (dirty = value) });
  };
  body.addEventListener("input", () => setDirty(true));
  addEventListener("message", async e => {
    const { id, type, payload = {} } = e.data || {};
    if (type === "document:open-buffer") {
      name = payload.fileName || name;
      body.value = new TextDecoder().decode(payload.buffer);
      body.readOnly = !!payload.readonly;
      dirty = false;
      post("document:opened", { readonly: body.readOnly }, id);
    } else if (type === "document:set-readonly") {
      body.readOnly = !!payload.readonly;
      post("document:readonly-changed", { readonly: body.readOnly }, id);
    } else if (type === "document:save") {
      const file = new File([body.value], name);
      setDirty(false);
      post("document:saved", { file, fileName: name, dirty }, id);
    }
  });
  addEventListener("load", () => post("document:ready"));
</script>
